<svg xmlns="http://www.w3.org/2000/svg" width="960" height="386" viewBox="0 0 960 386" role="img" aria-labelledby="t d">
  <title id="t">slashI18n — client-side description rewrite</title>
  <desc id="d">The toolkit wraps the commands and skills list responses and rewrites descriptions and hints through an exact-match English-to-Chinese dictionary before the menu renders.</desc>
  <defs>
    <style>
      .bg{fill:#ffffff;} .panel{fill:#f6f8fa;stroke:#d0d7de;} .card{fill:#ffffff;stroke:#d0d7de;}
      .t{fill:#1f2328;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",Helvetica,Arial,sans-serif;}
      .muted{fill:#59636e;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",Helvetica,Arial,sans-serif;}
      .title{font-size:19px;font-weight:700;} .sub{font-size:12px;}
      .name{font-size:12.5px;font-weight:600;} .tiny{font-size:11px;}
      .code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;font-weight:600;}
      .arrow{stroke:#59636e;stroke-width:1.5;fill:none;}
      .green-bg{fill:#dafbe1;stroke:#4ac26b;} .green{fill:#1a7f37;}
      .blue-bg{fill:#ddf4ff;stroke:#54aeff;} .blue{fill:#0969da;}
      @media (prefers-color-scheme: dark){
        .bg{fill:#0d1117;} .panel{fill:#161b22;stroke:#30363d;} .card{fill:#1c2128;stroke:#30363d;}
        .t{fill:#e6edf3;} .muted{fill:#9198a1;}
        .green-bg{fill:#0f2f1a;stroke:#2ea043;} .green{fill:#3fb950;}
        .blue-bg{fill:#0c2d6b;stroke:#1f6feb;} .blue{fill:#58a6ff;} .arrow{stroke:#9198a1;}
      }
    </style>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#59636e"/>
    </marker>
  </defs>

  <rect class="bg" width="960" height="386" rx="16"/>
  <text class="t title" x="34" y="46">slashI18n — client-side description rewrite</text>
  <text class="muted sub" x="34" y="70">The shell copy is already localized; the entries' own descriptions arrive from the host in English and are translated before any consumer reads them.</text>

  <rect class="card" x="32" y="104" width="184" height="82" rx="11"/>
  <text class="t name" x="46" y="132">“/” menu opens</text>
  <text class="muted tiny" x="46" y="152">group titles and the</text>
  <text class="muted tiny" x="46" y="168">skeleton rows are stock</text>

  <path class="arrow" marker-end="url(#ah)" d="M 218 145 L 240 145"/>

  <rect class="card" x="242" y="104" width="212" height="82" rx="11"/>
  <text class="t name" x="256" y="132">Remote list calls</text>
  <text class="code muted" x="256" y="152">remote.commands.list</text>
  <text class="code muted" x="256" y="168">remote.skills.list</text>

  <path class="arrow" marker-end="url(#ah)" d="M 456 145 L 478 145"/>

  <rect class="blue-bg" x="480" y="104" width="248" height="82" rx="11"/>
  <text class="blue name" x="494" y="132">Dictionary wrap</text>
  <text class="muted tiny" x="494" y="152">exact-match en→zh on each entry's</text>
  <text class="code muted" x="494" y="168">description · input.hint</text>

  <path class="arrow" marker-end="url(#ah)" d="M 730 145 L 752 145"/>

  <rect class="green-bg" x="754" y="104" width="174" height="82" rx="11"/>
  <text class="green name" x="768" y="132">Menu renders</text>
  <text class="muted tiny" x="768" y="152">Chinese descriptions,</text>
  <text class="muted tiny" x="768" y="168">names unchanged</text>

  <rect class="card" x="32" y="224" width="440" height="80" rx="11"/>
  <text class="t name" x="46" y="252">A dictionary miss keeps the original string</text>
  <text class="muted tiny" x="46" y="272">a dsh update that rewords a description degrades to English</text>
  <text class="muted tiny" x="46" y="288">until the dictionary catches up — the menu never breaks</text>

  <rect class="card" x="488" y="224" width="440" height="80" rx="11"/>
  <text class="t name" x="502" y="252">Fields that are never translated</text>
  <text class="code muted" x="502" y="272">name · whenToUse · modelInvocable</text>
  <text class="muted tiny" x="502" y="288">fuzzy matching, draft chips and claim adjudication read them</text>

  <text class="muted tiny" x="34" y="330">Applies only while the UI language is Chinese; the toggle is re-read per RPC result, so switching takes effect at the very next menu opening.</text>
  <text class="muted tiny" x="34" y="348">Results are rebuilt into fresh objects, errors pass through untouched, and re-applying the plugin cannot double-wrap a method.</text>
  <text class="muted tiny" x="34" y="366">Skills you author yourself can carry a Chinese description in their SKILL.md frontmatter — the dictionary only covers what ships with dsh.</text>
</svg>
