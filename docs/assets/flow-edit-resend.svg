<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="t d">
  <title id="t">editLastMessage — in-place rewrite flow</title>
  <desc id="d">Before: a user message, a failed turn and its events. session.rewrite replaces the tail so the derived model history contains only the edited message.</desc>
  <defs>
    <style>
      .bg{fill:#ffffff;} .panel{fill:#f6f8fa;stroke:#d0d7de;} .card{fill:#ffffff;stroke:#d0d7de;}
      .t{fill:#1f2328;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",Helvetica,Arial,sans-serif;}
      .muted{fill:#59636e;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",Helvetica,Arial,sans-serif;}
      .title{font-size:19px;font-weight:700;} .sub{font-size:12px;} .lab{font-size:12px;font-weight:700;letter-spacing:.06em;}
      .name{font-size:12.5px;font-weight:600;} .tiny{font-size:11px;}
      .code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;font-weight:600;}
      .arrow{stroke:#59636e;stroke-width:1.5;fill:none;}
      .blue-bg{fill:#ddf4ff;stroke:#54aeff;} .green-bg{fill:#dafbe1;stroke:#4ac26b;}
      .red-bg{fill:#ffebe9;stroke:#ff8182;} .ghost{fill:none;stroke:#cf222e;stroke-dasharray:5 4;}
      .green{fill:#1a7f37;} .red{fill:#cf222e;} .blue{fill:#0969da;}
      @media (prefers-color-scheme: dark){
        .bg{fill:#0d1117;} .panel{fill:#161b22;stroke:#30363d;} .card{fill:#1c2128;stroke:#30363d;}
        .t{fill:#e6edf3;} .muted{fill:#9198a1;}
        .blue-bg{fill:#0c2d6b;stroke:#1f6feb;} .green-bg{fill:#0f2f1a;stroke:#2ea043;}
        .red-bg{fill:#3c1618;stroke:#da3633;} .ghost{stroke:#f85149;}
        .green{fill:#3fb950;} .red{fill:#f85149;} .blue{fill:#58a6ff;}
        .arrow{stroke:#9198a1;}
      }
    </style>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#59636e"/>
    </marker>
  </defs>

  <rect class="bg" width="960" height="400" rx="16"/>
  <text class="t title" x="34" y="46">editLastMessage — in-place rewrite</text>
  <text class="muted sub" x="34" y="70">Surface <tspan class="code">replace</tspan> rewinds the model context; the physical log stays append-only.</text>

  <!-- BEFORE -->
  <rect class="panel" x="24" y="92" width="400" height="236" rx="12"/>
  <text class="muted lab" x="42" y="116">BEFORE</text>
  <text class="muted tiny" x="42" y="133">session log · seq 41 …</text>

  <rect class="blue-bg" x="42" y="146" width="290" height="40" rx="9"/>
  <text class="t name" x="58" y="171">user · “fix the parser bug”</text>

  <rect class="red-bg" x="42" y="196" width="330" height="40" rx="9"/>
  <text class="red name" x="58" y="221">✗ failed answer (turn 7)</text>

  <rect class="card" x="42" y="246" width="300" height="32" rx="8"/>
  <text class="muted tiny" x="58" y="267">turn/chunk · tool/result · turn/retry</text>

  <text class="muted tiny" x="42" y="308">Model sees msg 41 + the whole failed tail.</text>

  <!-- rewrite arrow -->
  <path class="arrow" marker-end="url(#ah)" d="M 430 210 L 512 210"/>
  <text class="t code" x="471" y="196" text-anchor="middle">session.rewrite</text>
  <text class="muted tiny" x="471" y="232" text-anchor="middle">{ sessionId,</text>
  <text class="muted tiny" x="471" y="246" text-anchor="middle">  messageSeq, content }</text>

  <!-- AFTER -->
  <rect class="panel" x="536" y="92" width="400" height="236" rx="12"/>
  <text class="muted lab" x="554" y="116">AFTER</text>
  <text class="muted tiny" x="554" y="133">same log · new turn 8</text>

  <rect class="green-bg" x="554" y="146" width="290" height="40" rx="9"/>
  <text class="green name" x="570" y="171">user · “fix the parser *lexer* bug”</text>

  <rect class="green-bg" x="554" y="196" width="330" height="40" rx="9"/>
  <text class="green name" x="570" y="221">✓ new answer (turn 8)</text>

  <rect class="ghost" x="554" y="246" width="330" height="32" rx="8"/>
  <text class="red tiny" x="570" y="267">old message + failed turn → erased</text>

  <text class="t tiny" x="554" y="308">Model sees only the edited message + the new turn.</text>

  <text class="muted tiny" x="34" y="360">Client: an Edit button on the last human message opens an inline editor; the host RPC validates an idle session and a last-user-message target.</text>
  <text class="muted tiny" x="34" y="378">The agent loop then replaces the shadowed surface range. No new event type, no persistence change; without host support the button reports it and stops.</text>
</svg>
