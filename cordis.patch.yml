# DeepSeek Harness - Personal Toolkit Plugin
#
# Neutral defaults only: the user's profile patch layer wins per row, and the
# browser half reads the resolved section live through its settings scope.
# An empty chatWorkspacePath resolves to <DSH_HOME>/chat at load time; the
# title is the display name of the default no-project chat workspace.
# The models* rows shape the modelCapability optimization (the moved
# 「模型能力」 section); modelsApiKey stays empty so the environment variable
# modelsApiKeyEnvVar wins until the user fills the card in.
- insert:
    - id: toolkit
      name: 'dsh-plugin-toolkit'
      inject:
        - settings
      config:
        optimizations:
          workspacelessChat: true
          editLastMessage: true
          viewActivity: true
          slashI18n: true
          changeReport: true
          opencodeSession: true
          modelCapability: true
        chatWorkspacePath: ''
        chatWorkspaceTitle: '通用对话'
        modelsApiKey: ''
        modelsApiKeyEnvVar: OPENCODE_API_KEY
        modelsRouteKey: opencode-go
        modelsBaseURL: https://opencode.ai/zen/go/v1
        modelsRouteApi: openai-completions
        modelsSyncPath: /api/toolkit/sync-models
        modelsPath: /api/toolkit/models
        # Per-route endpoint overrides for routes that configure no baseURL of
        # their own (a pi-ai catalog route such as minimax-cn or kimi-coding).
        # The discovery enrichment probes every llm-pi-ai route it can resolve
        # an endpoint and credential for; this map is how a catalog route gets
        # one. Either the endpoint string, or { baseURL, api } when the route's
        # protocol is not stated in its profile. The primary route below needs
        # no entry.
        modelsRouteBaseURLs: {}
        # Model ids an endpoint serves without ever listing them, keyed by route.
        # MiniMax answers 200 for MiniMax-M3.1-Flash-Preview on the same key while
        # /anthropic/v1/models omits it (preview ids stay off the public listing),
        # so a hidden model has to be declared here to reach the picker. Example:
        #   modelsRouteExtraModels:
        #     minimax-cn: [MiniMax-M3.1-Flash-Preview]
        modelsRouteExtraModels: {}
        modelsEnrichFromRegistry: true
        modelsRegistryProvider: opencode-go
        modelsVision: []
        modelsTextOnly: []
        modelsTimeoutSec: 10
